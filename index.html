    <!-- Shield against third-party Web3 wallet browser extension collisions -->
    <script>
      (function() {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                if (descriptor) {
                  descriptor.configurable = true;
                }
                return origDefineProperty.call(Object, obj, prop, descriptor);
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    window.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            return origDefineProperty.apply(Object, arguments);
          };
        } catch (_) {}

        window.addEventListener('error', function(event) {
          var isExtension = event.filename && (
            event.filename.indexOf('chrome-extension://') !== -1 ||
            event.filename.indexOf('moz-extension://') !== -1 ||
            event.filename.indexOf('evmAsk.js') !== -1
          );
          var isEthereumError = event.message && (
            event.message.indexOf('Cannot redefine property: ethereum') !== -1 ||
            event.message.indexOf('ethereum') !== -1
          );
          if (isExtension || isEthereumError) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
